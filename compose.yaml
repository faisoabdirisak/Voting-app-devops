name: voting-app

services:

  # ==========================================
  # 1. Python Voting Service
  # ==========================================
  vote:
    build:
      context: .
      dockerfile: docker/vote.Dockerfile
    image: voting-app-vote:v1
    ports:
      - "8082:80"
    depends_on:
      - redis
    restart: unless-stopped

  # ==========================================
  # 2. Redis Message Queue
  # ==========================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # ==========================================
  # 3. .NET Background Worker
  # ==========================================
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: voting-app-worker:v1
    depends_on:
      - redis
      - db
    restart: unless-stopped

  # ==========================================
  # 4. PostgreSQL Database
  # ==========================================
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ==========================================
  # 5. Node.js Results Service
  # ==========================================
  result:
    build:
      context: .
      dockerfile: docker/result.Dockerfile
    image: voting-app-result:v1
    ports:
      - "8083:4000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: